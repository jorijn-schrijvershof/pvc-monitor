nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  # Build and push your own image; there is no public one.
  repository: registry.example.com/pvc-monitor
  tag: ""            # defaults to .Chart.AppVersion (a placeholder)
  # Image digest ("sha256:..."). When set it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry, e.g. [{name: my-registry-credentials}].
imagePullSecrets: []

serviceAccount:
  create: true
  # Required when create is false: the existing ServiceAccount that receives
  # cluster-wide read access to PVs, PVCs and VolumeSnapshots.
  name: ""           # defaults to the fullname when create is true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Addresses (comma-separated IPs or CIDRs) whose X-Forwarded-* headers uvicorn
# trusts. Empty keeps the uvicorn default (loopback only), so the scheme and
# client address sent by the Gateway are ignored. Set it to the Gateway data-plane
# pod range so the app sees the original https scheme.
forwardedAllowIps: ""

# CA bundle used to verify the vCenter TLS certificate. Name an existing ConfigMap
# or Secret in the release namespace (not both); the chart mounts it read-only and
# sets VCENTER_CA_FILE. Leave both empty to use the system trust store.
vcenterCA:
  configMapName: ""
  secretName: ""
  key: ca.crt

# Kubernetes clusters whose PersistentVolumes count as claims on vSphere disks.
# List every cluster that uses the same vCenter; a disk of a cluster that is not
# listed is reported as not claimed (category "foreign" or "unknown" when CNS
# knows it). If any listed cluster cannot be read, no unclaimed-disk result is
# produced. Remote clusters need a read-only ClusterRole for persistentvolumes,
# persistentvolumeclaims, volumesnapshots and volumesnapshotcontents (verb list);
# see the README.
clusters:
  # Display name of the cluster the application runs in (read with its own ServiceAccount).
  localName: local
  # cluster-id from this cluster's vSphere CSI configuration ([Global] cluster-id in
  # csi-vsphere.conf). Needed to place disks with Cloud Native Storage.
  localCsiClusterId: ""
  # Existing Secret in the release namespace with one kubeconfig per key. Each
  # kubeconfig must embed its credentials and CA (token or client certificate);
  # exec and auth-provider plugins do not work in this image.
  kubeconfigSecret: ""
  # Other clusters, for example:
  #   - name: cluster-b
  #     kubeconfigKey: cluster-b     # key in kubeconfigSecret
  #     context: ""                  # optional; default is the kubeconfig's current context
  #     csiClusterId: cluster-b
  remote: []

# Credentials / app config, injected via envFrom.
secret:
  # Use a Secret you manage yourself (must exist in the release namespace).
  # When set, the chart does not create one and cannot check its contents; the
  # application itself refuses to start when authentication is enabled but the
  # OIDC settings or SESSION_SECRET are missing.
  existingSecret: ""
  # Otherwise the chart creates a Secret from these values. Supply real values with
  # `--set-file`/a private values file or (better) use existingSecret / an external secret operator.
  data:
    VCENTER_HOST: ""
    VCENTER_USER: ""
    VCENTER_PASSWORD: ""
    VCENTER_PORT: "443"
    # Verify the vCenter certificate. Use vcenterCA for a private CA instead of disabling this.
    VCENTER_VERIFY_SSL: "true"
    # Seconds a finished vCenter scan is reused.
    VCENTER_CACHE_SECONDS: "60"
    # Comma-separated datastore names to scan; empty scans every datastore the account can see.
    VCENTER_DATASTORES: ""
    # Query Cloud Native Storage for the cluster each disk belongs to. With "false"
    # no unclaimed disk can be categorised (all become "unknown").
    VCENTER_CNS_ENABLED: "true"
    # Unclaimed disks younger than this are flagged too young and never counted as actionable.
    UNCLAIMED_MIN_AGE_HOURS: "24"

    # Kubernetes, single-cluster form only (not used when clusters.remote is set).
    # In-cluster access needs none of these. They apply when K8S_SERVER/K8S_TOKEN or
    # KUBECONFIG_PATH are added here; mount the referenced files yourself.
    K8S_CONTEXT: ""
    K8S_CA_FILE: ""
    K8S_VERIFY_SSL: "true"

    # Email alerting
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USE_TLS: "true"
    SMTP_FROM: ""
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    ALERT_EMAIL_TO: ""
    ALERT_SNAPSHOT_AGE_DAYS: "7"
    # Minimum 1.
    ALERT_CHECK_INTERVAL_HOURS: "24"

    # OIDC authentication. With AUTH_ENABLED other than "false", OIDC_ISSUER,
    # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET and SESSION_SECRET are required; rendering
    # fails without them. AUTH_ENABLED: "false" is only accepted when the app is not
    # exposed (gateway.enabled=false and service.type=ClusterIP).
    AUTH_ENABLED: "true"
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ""
    OIDC_CLIENT_SECRET: ""
    # Full callback URL, e.g. https://pvc-monitor.example.com/auth/callback
    OIDC_REDIRECT_URI: ""
    OIDC_SCOPES: "openid email profile groups"
    # Comma-separated groups allowed to access the app; empty allows all authenticated users.
    ALLOWED_GROUPS: ""
    # At least 32 random characters, e.g. `openssl rand -hex 32`.
    SESSION_SECRET: ""
    SESSION_SECURE: "true"
    SESSION_MAX_AGE_HOURS: "12"
    # Comma-separated Host header values the app accepts, e.g. the gateway hostname.
    TRUSTED_HOSTS: ""
    # Exposes vSphere diagnostics; keep disabled outside troubleshooting.
    ENABLE_DEBUG_ENDPOINT: "false"

# Gateway API exposure.
gateway:
  enabled: true
  hostname: pvc-monitor.example.com
  # Existing Gateway the ListenerSet attaches to. It must allow ListenerSets
  # (spec.allowedListeners.namespaces.from).
  parentRef:
    name: ""
    namespace: ""
    group: gateway.networking.k8s.io
    kind: Gateway
  listenerSet:
    name: ""         # defaults to the fullname
    listenerName: https
    port: 443
    protocol: HTTPS
    tlsMode: Terminate
    # Secret holding the TLS cert; defaults to the hostname.
    tlsSecretName: ""
  httpRoute:
    annotations: {}
    path: /
    pathType: PathPrefix

# cert-manager Certificate for the listener's TLS secret.
certificate:
  enabled: true
  issuerRef:
    name: ""         # required when certificate.enabled and gateway.enabled
    kind: ClusterIssuer
    group: cert-manager.io

# Ingress NetworkPolicy for the pod. Only the peers in ingressFrom may reach the
# HTTP port; everything else is denied. Set ingressFrom to the Gateway data plane,
# for example:
#   ingressFrom:
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: gateway-system
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: my-gateway
# Kubelet probes come from the pod's own node. NetworkPolicy does not block traffic
# from the node a pod runs on, so probes keep working without a rule; this also
# means other host-network processes on that node are not restricted. With gateway.enabled an empty ingressFrom fails rendering;
# without it, an empty list denies all ingress.
networkPolicy:
  enabled: true
  ingressFrom: []
